<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Vikas ❤️</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
}

.card {
  background: rgba(255,255,255,0.95);
  padding: 35px;
  border-radius: 25px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  max-width: 420px;
  text-align: center;
  animation: fadeIn 2s;
}

h1, h2 { color: #ff4d6d; }

p {
  color: #444;
  line-height: 1.7;
  font-size: 15px;
}

.photos {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 50px;   /* moves pictures down */
  margin-bottom: 10px;
}


.photos img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  object-fit: contain;
  border: 3px solid #ff4d6d;
}

button {
  padding: 12px 28px;
  margin: 15px;
  font-size: 16px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

#yes {
  background: #ff4d6d;
  color: white;
}

#no {
  background: #ccc;
  position: absolute;
}

.heart {
  position: fixed;
  bottom: -10px;
  animation: floatUp 6s linear infinite;
}
.polaroid {
  background: white;
  padding: 10px 10px 25px 10px;
  width: 120px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  border-radius: 6px;
  text-align: center;
  font-size: 14px;
}

.polaroid img {
  width: 100%;
  height: 120px;
  object-fit: contain;   /* 🔥 NO CROPPING */
  background: #fff;      /* clean white space */
  padding: 4px;
  border-radius: 4px;
}

.polaroid p {
  margin: 8px 0 0;
  color: #555;
  font-style: italic;
}

.polaroid.left {
  transform: rotate(-6deg);
}

.polaroid.right {
  transform: rotate(6deg);
}


@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-110vh); opacity: 0; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>
<script>
function playSong() {
  document.getElementById("song").play();
  alert("You just made me the happiest 💕");
}
</script>

<body>

<audio id="song">
  <source src="cheliya_cheliya.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <h1>Hey Vikas ❤️</h1>

 <div class="photos">
  <div class="polaroid left">
    <img src="her.png">
    <p>My favorite love story 💘</p>
  </div>
  <div class="polaroid right">
    <img src="him.png">
    <p>Somewhere between forever & always💕</p>
  </div>
</div>


  <p id="typing"></p>

  <h2>Will you be my Valentine!? ❤️🌹</h2>

  <button class="yes" onclick="playSong()">
  Yes 💘
</button>

  <button id="no" onmouseover="moveButton()">NO 🙄</button>
</div>

<script>
const text = `Some people slowly become home without even trying.
With you, love never felt loud — it felt safe, calm, and real.

In the little things, the quiet moments, and the way you understand me,
I found something I never want to lose.
Every time I hear this song, it reminds me of how deeply and honestly
my heart feels about you.

So today, with a full heart and endless love,
I want to ask you ..…
`;

let i = 0;
function typingEffect() {
  if (i < text.length) {
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typingEffect, 40);
  }
}
typingEffect();

setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 15 + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}, 400);

function moveButton() {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  document.getElementById("no").style.left = x + "px";
  document.getElementById("no").style.top = y + "px";
}

function yesClicked() {
  document.body.innerHTML = `
    <div class="card">
      <h1>YAYYY 💕</h1>
      <p>You just made my heart the happiest 🥺❤️<br><br>
      I promise to choose you, every day.</p>
    </div>`;
}
</script>

</body>
</html>
